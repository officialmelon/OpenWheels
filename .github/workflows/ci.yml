# Runs on every push and pull request: the engine-free unit tests, the version / changelog
# consistency check, and the smoke tests that play synthetic levels in the real game (headless).
# The release workflow runs the same checks before it publishes anything.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ENGINE_CACHE_VERSION: 1

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ zlib1g-dev libssl-dev python3
      - name: Unit tests (site protocol, level lists, records, versions)
        run: tests/run_unit.sh
      - name: Version / changelog consistency
        run: python3 tests/check_release_consistency.py
      - name: Python tools compile
        run: python3 -m compileall -q tools tests

  smoke:
    name: Smoke tests (game, headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build python3 libx11-dev libxi-dev \
            libxrandr-dev libxxf86vm-dev libxinerama-dev libxcursor-dev libfontconfig1-dev libgtk-3-dev \
            zlib1g-dev libpng-dev libglew-dev libgl1-mesa-dev libcurl4-openssl-dev libsqlite3-dev \
            libopenal-dev libvorbis-dev libmpg123-dev xvfb xdotool imagemagick python3-pil python3-numpy python3-pycryptodome \
            libgl1-mesa-dri
      - uses: actions/cache@v4
        with:
          path: thirdparty/cocos2d-x
          key: engine-posix-${{ env.ENGINE_CACHE_VERSION }}-${{ hashFiles('tools/fetch_engine.sh', 'thirdparty/patches/*.patch') }}
      - name: Fetch cocos2d-x
        run: tools/fetch_engine.sh
      - name: Build
        run: tools/build.sh --config Release --build-dir build-ci
      - name: Game files from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl game
          gh release download -R "${GITHUB_REPOSITORY}" -p OpenWheels-linux-x86_64.tar.gz -D dl --clobber
          tar -xzf dl/OpenWheels-linux-x86_64.tar.gz -C game
          exe="$(find game -maxdepth 2 -name OpenWheels -type f | head -1)"
          cp build-ci/bin/OpenWheels/OpenWheels "${exe}"   # the freshly built game on the released files
          echo "SMOKE_EXE=${PWD}/${exe}" >> "${GITHUB_ENV}"
      - name: Smoke tests
        run: python3 tests/smoke/run_smoke.py --exe "${SMOKE_EXE}" --retries 1 --keep
      - name: Screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: /tmp/ow-smoke-*
          retention-days: 3
