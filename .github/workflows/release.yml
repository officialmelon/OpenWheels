# Builds every OpenWheels release package and (optionally) publishes them as a GitHub release.
#
#   Windows (Win32)    OpenWheels-windows.zip              required
#   Android            OpenWheels-release.apk              required
#   Linux (x86_64)     OpenWheels-linux-x86_64.tar.gz      required
#   macOS (x86_64)     OpenWheels-macos.zip                best effort (ad-hoc / Developer ID signed)
#   iOS                OpenWheels-ios[-unsigned].ipa       best effort (unsigned for sideloading unless signed)
#
# Game files: the repository never contains Happy Wheels assets. The packages are built with the
# game data of a previous OpenWheels release (its Windows zip: assets/, generated/, ios/ and the
# tables; see tools/release/extract_game_data.py), by default the latest release, or with a zip at
# the URL in the OW_GAME_DATA_URL secret.
#
# Triggers:
#   * pushing a tag v*        builds everything and publishes the release for that tag;
#   * Actions -> Release -> Run workflow: builds everything; with a tag it also creates the
#     release (as a draft unless "draft" is unticked), without one it only keeps the artifacts.
#
# Signing (docs/RELEASING.md): the ANDROID_KEYSTORE_* secrets sign the APK with the release key so
# it installs over earlier releases; a published release requires them, other runs build a
# debug-signed beta. Optional MACOS_*, IOS_* and WINDOWS_CERT_* secrets sign the other packages;
# without them macOS is ad-hoc signed and the iOS .ipa and Windows .exe are unsigned.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.3.1). Empty = build artifacts only.'
        required: false
        default: ''
      draft:
        description: 'Create the release as a draft'
        type: boolean
        default: true
      data_release:
        description: 'Release whose Windows zip provides the game files (empty = latest release)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ENGINE_CACHE_VERSION: 1
  # SHA-256 of the certificate every OpenWheels release APK has been signed with (CN=OpenWheels).
  OW_ANDROID_CERT_SHA256: 380d7580d468bfab2ff71ce47c3cd88d6dd064e8631ee87d7b77139f85ae0605

jobs:
  game-data:
    name: Game data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download the game data of a previous release
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_URL: ${{ secrets.OW_GAME_DATA_URL }}
          DATA_RELEASE: ${{ inputs.data_release }}
        run: |
          set -euo pipefail
          mkdir -p dl
          if [ -n "${DATA_URL}" ]; then
            curl -fsSL -o dl/package.zip "${DATA_URL}"
          else
            # The newest published release that has a Windows zip (the tag being built may
            # already exist as a release without one).
            tags="${DATA_RELEASE}"
            if [ -z "${tags}" ]; then
              tags="$(gh release list -R "${GITHUB_REPOSITORY}" --exclude-drafts --limit 30 --json tagName -q '.[].tagName')"
            fi
            for tag in ${tags}; do
              if gh release download "${tag}" -R "${GITHUB_REPOSITORY}" -p OpenWheels-windows.zip -D dl --clobber; then
                echo "game data from release ${tag}"
                mv dl/OpenWheels-windows.zip dl/package.zip
                break
              fi
            done
            [ -f dl/package.zip ] || { echo "::error::no release with OpenWheels-windows.zip found"; exit 1; }
          fi
          python3 tools/release/extract_game_data.py dl/package.zip game-data
      - name: Draw missing restored-character portraits
        run: |
          python3 -m pip install --quiet numpy pillow
          python3 tools/assets/restored_portraits.py --optional --out game-data/generated/restored
      - uses: actions/upload-artifact@v4
        with:
          name: game-data
          path: game-data
          retention-days: 1

  linux:
    name: Linux
    needs: game-data
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build python3 libx11-dev libxi-dev \
            libxrandr-dev libxxf86vm-dev libxinerama-dev libxcursor-dev libfontconfig1-dev libgtk-3-dev \
            zlib1g-dev libpng-dev libglew-dev libgl1-mesa-dev libcurl4-openssl-dev libsqlite3-dev \
            libopenal-dev libvorbis-dev libmpg123-dev
      - uses: actions/cache@v4
        with:
          path: thirdparty/cocos2d-x
          key: engine-posix-${{ env.ENGINE_CACHE_VERSION }}-${{ hashFiles('tools/fetch_engine.sh', 'thirdparty/patches/*.patch') }}
      - name: Fetch cocos2d-x
        run: tools/fetch_engine.sh
      - name: Build
        run: tools/build.sh --config Release --build-dir build-release
      - uses: actions/download-artifact@v4
        with:
          name: game-data
          path: game-data
      - name: Package
        run: |
          tools/package_linux.sh --no-build --build-dir build-release --out dist \
            --assets game-data/assets --ios game-data/ios --data game-data
      - uses: actions/upload-artifact@v4
        with:
          name: OpenWheels-linux
          path: dist/OpenWheels-linux-x86_64.tar.gz

  windows:
    name: Windows
    needs: game-data
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: thirdparty/cocos2d-x
          key: engine-win32-${{ env.ENGINE_CACHE_VERSION }}-${{ hashFiles('tools/fetch_engine.ps1', 'thirdparty/patches/*.patch') }}
      - name: Fetch cocos2d-x
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\fetch_engine.ps1
      - name: Build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\build.ps1 -Config Release
      - name: Sign
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX_BASE64) {
            Write-Output 'no WINDOWS_CERT_PFX_BASE64 secret - OpenWheels.exe is not Authenticode-signed'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            build\bin\OpenWheels\Release\OpenWheels.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item $pfx
      - uses: actions/download-artifact@v4
        with:
          name: game-data
          path: game-data
      - name: Package
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools\package_windows.ps1 -NoBuild `
            -Assets game-data\assets -Ios game-data\ios -Data game-data -Out dist
      - uses: actions/upload-artifact@v4
        with:
          name: OpenWheels-windows
          path: dist/OpenWheels-windows.zip

  android:
    name: Android
    needs: game-data
    outputs:
      beta: ${{ steps.signing.outputs.beta }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" \
            "cmake;3.22.1" "ndk;27.3.13750724" > /dev/null
      - uses: actions/cache@v4
        with:
          path: thirdparty/cocos2d-x
          key: engine-posix-${{ env.ENGINE_CACHE_VERSION }}-${{ hashFiles('tools/fetch_engine.sh', 'thirdparty/patches/*.patch') }}
      - name: Fetch cocos2d-x
        run: tools/fetch_engine.sh
      - uses: actions/download-artifact@v4
        with:
          name: game-data
          path: game-data
      - name: Release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          PUBLISH: ${{ github.event_name == 'push' || (inputs.tag != '' && !inputs.draft) }}
        run: |
          # With the release key: the real app (org.openwheels.game), which installs over earlier
          # releases. Without it: a debug-signed beta (org.openwheels.game.beta) that installs
          # alongside them; a published release refuses to ship that.
          if [ -z "${KEYSTORE_BASE64}" ]; then
            if [ "${PUBLISH}" = "true" ]; then
              echo "::error::no ANDROID_KEYSTORE_BASE64 secret - a published release must be signed with the release key (see docs/RELEASING.md)"
              exit 1
            fi
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret - building a debug-signed beta APK (org.openwheels.game.beta)"
            echo "beta=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          mkdir -p "${RUNNER_TEMP}/signing"
          echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/signing/release.keystore"
          {
            echo "storeFile=${RUNNER_TEMP}/signing/release.keystore"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > "${RUNNER_TEMP}/signing/keystore.properties"
          echo "OW_KEYSTORE_PROPERTIES=${RUNNER_TEMP}/signing/keystore.properties" >> "${GITHUB_ENV}"
          # Artifact-only runs (no tag) stay betas so test builds don't replace the installed game.
          if [ -n "${TAG}" ]; then echo "beta=false" >> "${GITHUB_OUTPUT}"; else echo "beta=true" >> "${GITHUB_OUTPUT}"; fi
      - name: Build
        working-directory: android
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew --no-daemon assembleRelease \
            -POW_GAME_ASSETS="${GITHUB_WORKSPACE}/game-data/assets" \
            -POW_PREBUILT_DATA="${GITHUB_WORKSPACE}/game-data" \
            -POW_GAME_RES="${GITHUB_WORKSPACE}/none" \
            -POW_BETA_BUILD="${{ steps.signing.outputs.beta }}" \
            -POW_BETA_VERSION="${{ inputs.tag || github.ref_name }}"
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          cp app/build/outputs/apk/release/OpenWheels-release.apk "${GITHUB_WORKSPACE}/dist/"
      - name: Verify restored campaign is packaged
        run: |
          python3 - <<'PY'
          import plistlib
          import sys
          import zipfile

          apk = "dist/OpenWheels-release.apk"
          required = {
              "assets/levels/restored/chapters.plist",
              "assets/levels/restored/06_lawnmower_man/01_lawn_and_order.xml",
              "assets/levels/restored/07_explorer_guy/03_idol_hands.xml",
              "assets/levels/restored/11_helicopter_man/01_lift_off.xml",
              "assets/generated/restored/shared/Characters_restored.plist",
          }
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              missing = sorted(required - names)
              levels = [name for name in names
                        if name.startswith("assets/levels/restored/")
                        and name.endswith(".xml")]
              if missing:
                  sys.exit("APK is missing required restored-campaign files: " + ", ".join(missing))
              if len(levels) != 30:
                  sys.exit(f"Expected 30 restored campaign XMLs, found {len(levels)}")
              characters = plistlib.loads(
                  archive.read("assets/generated/restored/shared/Characters_restored.plist")
              )
              ids = {entry.get("id") for entry in characters if isinstance(entry, dict)}
              missing_ids = sorted({6, 7, 8, 10, 11} - ids)
              if missing_ids:
                  sys.exit("APK is missing restored character data for IDs: "
                           + ", ".join(map(str, missing_ids)))
          print("Verified: 30 restored campaign levels, all five restored characters, and the three pilot levels.")
          PY
      - name: Check the APK's signing certificate
        env:
          BETA: ${{ steps.signing.outputs.beta }}
        run: |
          set -euo pipefail
          certs="$("${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs dist/OpenWheels-release.apk)"
          echo "${certs}"
          if [ "${BETA}" != "true" ] && ! grep -qi "SHA-256 digest: ${OW_ANDROID_CERT_SHA256}" <<< "${certs}"; then
            echo "::error::the APK is not signed with the OpenWheels release key (SHA-256 ${OW_ANDROID_CERT_SHA256}): it would not install over earlier releases"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: OpenWheels-android
          path: dist/OpenWheels-release.apk

  macos:
    name: macOS (best effort)
    needs: game-data
    # The v3-deps-158 macOS prebuilts are x86_64 only: build on an Intel runner.
    runs-on: macos-15-intel
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: thirdparty/cocos2d-x
          key: engine-posix-${{ env.ENGINE_CACHE_VERSION }}-${{ hashFiles('tools/fetch_engine.sh', 'thirdparty/patches/*.patch') }}
      - name: Fetch cocos2d-x
        run: tools/fetch_engine.sh
      - name: Build
        run: tools/build.sh --config Release --build-dir build-release
      - uses: actions/download-artifact@v4
        with:
          name: game-data
          path: game-data
      - name: Package
        run: |
          set -euo pipefail
          app="$(find build-release/bin -maxdepth 3 -name 'OpenWheels.app' -type d | head -1)"
          [ -n "${app}" ] || { echo "::error::OpenWheels.app not found"; exit 1; }
          mkdir -p dist
          cp -R "${app}" dist/OpenWheels.app
          mkdir -p dist/OpenWheels.app/Contents/Resources
          cp -R game-data/assets dist/OpenWheels.app/Contents/Resources/assets
          cp -R game-data/generated dist/OpenWheels.app/Contents/MacOS/generated
          [ -d game-data/ios ] && cp -R game-data/ios dist/OpenWheels.app/Contents/MacOS/ios
          cp game-data/*.tsv dist/OpenWheels.app/Contents/MacOS/ 2>/dev/null || true
          cp LICENSE NOTICE.md dist/
      - name: Sign
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          cd dist
          if [ -n "${CERT_P12_BASE64}" ]; then
            # Developer ID: sign with the hardened runtime, then notarize and staple.
            kc="${RUNNER_TEMP}/ow.keychain-db"
            kcpw="$(uuidgen)"
            security create-keychain -p "${kcpw}" "${kc}"
            security set-keychain-settings -lut 21600 "${kc}"
            security unlock-keychain -p "${kcpw}" "${kc}"
            echo "${CERT_P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
            security import "${RUNNER_TEMP}/cert.p12" -k "${kc}" -P "${CERT_PASSWORD}" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "${kcpw}" "${kc}" > /dev/null
            # shellcheck disable=SC2046 # one argument per existing keychain
            security list-keychains -d user -s "${kc}" $(security list-keychains -d user | tr -d '"')
            identity="$(security find-identity -v -p codesigning "${kc}" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
            [ -n "${identity}" ] || { echo "::error::no Developer ID Application identity in MACOS_CERT_P12_BASE64"; exit 1; }
            codesign --force --deep --options runtime --timestamp -s "${identity}" OpenWheels.app
            codesign --verify --deep --strict --verbose=2 OpenWheels.app
            if [ -n "${NOTARY_APPLE_ID}" ]; then
              ditto -c -k --keepParent OpenWheels.app notarize.zip
              xcrun notarytool submit notarize.zip --apple-id "${NOTARY_APPLE_ID}" \
                --password "${NOTARY_PASSWORD}" --team-id "${NOTARY_TEAM_ID}" --wait
              xcrun stapler staple OpenWheels.app
              rm notarize.zip
            else
              echo "::warning::signed with Developer ID but not notarized (no MACOS_NOTARY_APPLE_ID secret)"
            fi
          else
            # No Apple Developer ID: ad-hoc signature. Signed on a copy so that a bundle codesign
            # can't seal is shipped unsigned rather than with a broken signature.
            cp -R OpenWheels.app adhoc.app
            if codesign --force --deep -s - adhoc.app && codesign --verify --deep --strict adhoc.app; then
              rm -rf OpenWheels.app && mv adhoc.app OpenWheels.app
              echo "ad-hoc signed"
            else
              rm -rf adhoc.app
              echo "::warning::ad-hoc signing failed - the app is shipped unsigned"
            fi
          fi
          ditto -c -k --keepParent OpenWheels.app OpenWheels-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OpenWheels-macos
          path: dist/OpenWheels-macos.zip

  ios:
    name: iOS (best effort)
    needs: game-data
    runs-on: macos-14
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: thirdparty/cocos2d-x
          key: engine-posix-${{ env.ENGINE_CACHE_VERSION }}-${{ hashFiles('tools/fetch_engine.sh', 'thirdparty/patches/*.patch') }}
      - name: Fetch cocos2d-x
        run: tools/fetch_engine.sh
      - uses: actions/download-artifact@v4
        with:
          name: game-data
          path: game-data
      - name: Build (unsigned)
        run: |
          set -euo pipefail
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE="${PWD}/thirdparty/cocos2d-x/cmake/ios.toolchain.cmake" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DOW_ANDROID_ASSETS="${PWD}/game-data/assets"
          status=0
          cmake --build build-ios --config Release -- -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > build-ios.log 2>&1 || status=$?
          # The xcodebuild log is huge: show the compiler errors (if any) and the summary.
          grep -E -A8 '(error|fatal error): ' build-ios.log | head -300 || true
          tail -40 build-ios.log
          exit "${status}"
      - name: Package (.ipa for sideloading)
        run: |
          set -euo pipefail
          # bin/OpenWheels/Release-iphoneos/ or bin/OpenWheels/Release/, depending on the CMake version
          app="$(find build-ios -name 'OpenWheels.app' -type d -path '*iphoneos*' | head -1)"
          [ -n "${app}" ] || app="$(find build-ios -name 'OpenWheels.app' -type d -not -path '*.build/*' -prune | head -1)"
          [ -n "${app}" ] || { echo "::error::OpenWheels.app not found"; find build-ios -name '*.app' -prune; exit 1; }
          echo "app: ${app}"
          mkdir -p dist/Payload
          cp -R "${app}" dist/Payload/OpenWheels.app
          cp -R game-data/generated dist/Payload/OpenWheels.app/generated
          [ -d game-data/ios ] && cp -R game-data/ios dist/Payload/OpenWheels.app/ios
          cp game-data/*.tsv dist/Payload/OpenWheels.app/ 2>/dev/null || true
      - name: Sign (.ipa)
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          cd dist
          if [ -z "${CERT_P12_BASE64}" ] || [ -z "${PROFILE_BASE64}" ]; then
            # No Apple signing identity: sideload tools (AltStore, Sideloadly) sign it on install.
            zip -qry OpenWheels-ios-unsigned.ipa Payload
            exit 0
          fi
          app=Payload/OpenWheels.app
          kc="${RUNNER_TEMP}/ow.keychain-db"
          kcpw="$(uuidgen)"
          security create-keychain -p "${kcpw}" "${kc}"
          security set-keychain-settings -lut 21600 "${kc}"
          security unlock-keychain -p "${kcpw}" "${kc}"
          echo "${CERT_P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "${kc}" -P "${CERT_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "${kcpw}" "${kc}" > /dev/null
          # shellcheck disable=SC2046 # one argument per existing keychain
          security list-keychains -d user -s "${kc}" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "${kc}" | awk -F'"' '/Apple (Distribution|Development)|iPhone (Distribution|Developer)/ {print $2; exit}')"
          [ -n "${identity}" ] || { echo "::error::no iOS signing identity in IOS_CERT_P12_BASE64"; exit 1; }
          # The profile decides the bundle ID and the entitlements.
          echo "${PROFILE_BASE64}" | base64 --decode > "${app}/embedded.mobileprovision"
          security cms -D -i "${app}/embedded.mobileprovision" > "${RUNNER_TEMP}/profile.plist"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "${RUNNER_TEMP}/profile.plist" > "${RUNNER_TEMP}/entitlements.plist"
          appid="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "${RUNNER_TEMP}/profile.plist")"
          bundle="${appid#*.}"
          case "${bundle}" in
            *'*'*) ;;   # wildcard profile: keep the app's own bundle ID
            *) /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${bundle}" "${app}/Info.plist" ;;
          esac
          if [ -d "${app}/Frameworks" ]; then
            find "${app}/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) \
              -exec codesign --force -s "${identity}" {} \;
          fi
          codesign --force -s "${identity}" --entitlements "${RUNNER_TEMP}/entitlements.plist" "${app}"
          codesign --verify --deep --strict --verbose=2 "${app}"
          zip -qry OpenWheels-ios.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OpenWheels-ios
          path: dist/OpenWheels-ios*.ipa

  release:
    name: Publish release
    needs: [linux, windows, android, macos, ios]
    if: >-
      always() &&
      needs.linux.result == 'success' && needs.windows.result == 'success' && needs.android.result == 'success' &&
      (github.event_name == 'push' || inputs.tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: OpenWheels-*
          path: packages
          merge-multiple: true
      - name: Release notes
        env:
          ANDROID_BETA: ${{ needs.android.outputs.beta }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          # The CHANGELOG.md section of this version ("## v0.3.0" up to the next "## ").
          awk -v v="## ${TAG}" '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "OpenWheels ${TAG}" > notes.md
          {
            echo
            echo "## Downloads"
            echo "- **Windows:** \`OpenWheels-windows.zip\` - unzip and run \`OpenWheels.exe\`."
            if [ "${ANDROID_BETA}" = "true" ]; then
              echo "- **Android:** \`OpenWheels-release.apk\` (beta: debug-signed, installs alongside the release app)."
            else
              echo "- **Android:** \`OpenWheels-release.apk\` - installs over earlier releases."
            fi
            echo "- **Linux (x86_64):** \`OpenWheels-linux-x86_64.tar.gz\` - unpack and run \`./OpenWheels\`."
            [ -f packages/OpenWheels-macos.zip ] && echo "- **macOS:** \`OpenWheels-macos.zip\` (not notarized: right-click the app, Open, the first time)."
            [ -f packages/OpenWheels-ios.ipa ] && echo "- **iOS:** \`OpenWheels-ios.ipa\`."
            [ -f packages/OpenWheels-ios-unsigned.ipa ] && echo "- **iOS:** \`OpenWheels-ios-unsigned.ipa\` (unsigned: sideload with AltStore, Sideloadly or similar)."
            echo
            echo "## Legal"
            echo "OpenWheels is an unofficial fan project. Happy Wheels and its assets belong to Fancy Force / Jim Bonacci. See [NOTICE.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/NOTICE.md)."
          } >> notes.md
          (cd packages && sha256sum -- * > SHA256SUMS.txt)
          ls -la packages
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
        run: |
          set -euo pipefail
          args=(--title "OpenWheels ${TAG}" --notes-file notes.md --target "${GITHUB_SHA}")
          [ "${DRAFT}" = "true" ] && args+=(--draft)
          if gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${TAG}" packages/* -R "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" packages/* -R "${GITHUB_REPOSITORY}" "${args[@]}"
          fi
