org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=false
android.nonTransitiveRClass=true

# ABIs to build, ':'-separated. The cocos2d-x v3-deps-158 Android prebuilts (Box2D, freetype,
# png, jpeg, webp, tiff, curl, openssl, websockets, ...) exist for arm64-v8a, armeabi-v7a and x86
# only - there is no x86_64 build of them, so x86_64 is not possible. x86 runs natively on the
# x86_64 emulator images (they keep 32-bit support).
OW_ABIS=arm64-v8a:armeabi-v7a:x86

# Where the player's own game files are read from at build time (never committed). Relative
# paths are relative to the repository root; override with -POW_GAME_ASSETS=... etc.
OW_GAME_ASSETS=binary/HappyWheels_Android/HW_Android/assets
OW_GAME_RES=binary/HappyWheels_Android/HW_Android/res
OW_GAME_LIB=binary/HappyWheels_Android/config.arm64_v8a/lib/arm64-v8a/libMyGame.so
OW_IOS_APP=binary/HappyWheels_iOS/Payload/happywheels.app
